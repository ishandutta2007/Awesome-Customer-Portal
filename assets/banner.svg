<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#101935"/><stop offset="100%" stop-color="#070b14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-18px) translateX(8px);opacity:.6}}@keyframes waveFlow{0%{stroke-dashoffset:0}}@keyframes pillFloat{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.title{font-weight:800;font-size:52px;fill:#fff;letter-spacing:-.5px}.badge-text,.subtitle,.tag-text,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:21px;fill:#94a3b8}.badge-text,.tag-text{font-size:13px}.tag-text{font-weight:600;fill:#38bdf8;letter-spacing:.5px}.badge-text{font-weight:500;fill:#e2e8f0}.pulsing-orb{transform-origin:center;animation:pulseGlow 6s ease-in-out infinite}.particle-1{animation:floatParticle 8s ease-in-out infinite}.particle-2{animation:floatParticle 6s ease-in-out infinite 1.5s}.particle-3{animation:floatParticle 7s ease-in-out infinite 3s}.stream-line{stroke-dasharray:8 12;animation:waveFlow 4s linear infinite}.float